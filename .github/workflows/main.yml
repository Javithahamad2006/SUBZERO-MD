name: SUBZERO-MD-CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subzero-md:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Environment Info
        run: |
          node -v
          npm -v
          ls -la

      - name: Install Dependencies
        run: |
          npm install --no-package-lock

      - name: Validate Files
        run: |
          test -f index.js || exit 1
          test -f package.json || exit 1
          echo "Start script:"
          node -e "console.log(require('./package.json').scripts.start)"

      - name: Run SUBZERO-MD (Test Mode)
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: |
          echo "Starting bot..."
          timeout 1200 npm start || echo "Stopped"

      - name: Done
        if: always()
        run: echo "Workflow finished"
